# 在 GitHub 上云编译 Clawket 安卓 APK（社区构建 = 不配计费 = Pro 功能解锁）
# 用法：把本文件放到你 fork 的 Clawket 仓库的 .github/workflows/ 目录下，
#      然后在仓库的 Actions 页面手动触发（Run workflow），跑完在 Artifacts 里下载 APK。
name: Build Clawket Android APK (Community)

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (android)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Patch native deps (best effort)
        working-directory: apps/mobile
        run: ./scripts/patch-android-native-deps.sh || true

      - name: Ensure release build falls back to debug signing (社区构建无正式签名)
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          if p.exists():
              t = p.read_text()
              # 若 release 块仍指向 release 签名又没有 keystore，则回退 debug 签名
              t = t.replace('signingConfig signingConfigs.release\n        }\n        release {',
                            'signingConfig signingConfigs.debug\n        }\n        release {')
              p.write_text(t)
              print('build.gradle normalized')
          else:
              print('build.gradle not found!')
          PY

      - name: Build release APK
        working-directory: apps/mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease -x lint -x test --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find apps/mobile/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -l "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawket-community-apk
          path: apps/mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
