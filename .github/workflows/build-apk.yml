# 云编译 Clawket 安卓 APK（社区构建 = 不配计费 = Pro 解锁）
name: Build Clawket Android APK (Community)

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (android)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Patch native deps (best effort)
        working-directory: apps/mobile
        run: ./scripts/patch-android-native-deps.sh || true

      - name: Build release APK (community build allowed)
        working-directory: apps/mobile/android
        run: >
          chmod +x gradlew &&
          ./gradlew assembleRelease -x lint -x test --no-daemon --stacktrace
          -Pclawket.allowDebugReleaseSigning=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawket-community-apk
          path: apps/mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
